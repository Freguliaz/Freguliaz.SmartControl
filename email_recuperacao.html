<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control - Esqueceu a senha</title>
    <link rel="stylesheet" href="assets/css/email.recuperacao.css">
</head>
<body>
    <header>
        <div id="logo">
            <img src="assets/images/img1.png" alt="Imagem da Logo">
        </div>
        <div id="titulo_dashboard">
            <h1>E-mail de Recuperação</h1>
        </div>
        <details class="menu">
            <summary id="icone_hamburgueria">
                <div class="menu_hamburguer">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </summary>
            <nav>
                <ul>
                    <li><a href="#">Configurações</a></li>
                    <li><a href="#">Perfil</a></li>
                    <li><a href="index.html">Voltar</a></li>
                </ul>
            </nav>
        </details>
    </header>
    <main>
        <div id="perfil">
            <img src="assets/images/img2.png" alt="Imagem de Perfil" height="50" width="50">
        </div>
        <form class="form_email_recuperacao" method="dialog">
            <label for="email_recuperacao">E-mail de Recuperação</label>
            <input type="email" name="email_recuperacao" id="email_recuperacao" placeholder="Digite seu e-mail de recuperação" required>
            <button type="submit">Enviar código</button>
        </form>
        <form class="form_codigo_recuperacao" method="get" action="forget_senha.html">
            <label for="codigo_recuperacao">Digite o Código de Recuperação</label>
            <input type="text" name="codigo" id="codigo" placeholder="Digite o código" required minlength="6" maxlength="6">
            <button type="submit">Confirmar</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Fregulia. Todos os direitos reservados</p>
        <ul>
            <li><a id="sobre" href="https://pedrotech.com.br/pedrolandia/" target="_blank">Sobre</a></li>
            <li><a id="contato" href="#">Contato</a></li>
        </ul>
    </footer>
</body>
</html>
