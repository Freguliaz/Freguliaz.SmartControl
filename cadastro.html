<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control - Cadastro</title>
</head>
<body>
    <header>
        <div id="logo">
            <img src="assets/images/img1.png" alt="Imagem da Logo" height="50" width="50">
        </div>
    </header>
    <div id="perfil">
        <img src="assets/images/img2.png" alt="Imagem de Perfil" height="50" width="50">
    </div>
    <form class="form_cadastro" method="get" action="index.html">
        <label for="nome_completo">Nome Completo</label>
        <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite seu nome completo" required>
        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>
        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required minlength="8">
        <label for="termos de uso">Termos de uso</label>
        <input type="checkbox" name="termos de uso" id="termos de uso">
        <div>
            <input type="submit" id="cadastro" value="cadastro">
        </div>
    </form>
    <footer>
        <a href="index.html">Voltar ao início</a>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d17798.935939677755!2d-43.35831459932561!3d-21.744780531136595!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x989dc682b0776d%3A0x354504dbf7ee8576!2sWebCertificados!5e0!3m2!1spt-BR!2sbr!4v1785874096057!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </footer>
</body>
</html>
