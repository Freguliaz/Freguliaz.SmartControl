<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

    <header>
        <div id="logo">
            <img src="assets/images/img1.png" alt="Imagem da Logo" height="50" width="50">
        </div>
    </header>

    <div id="perfil">
        <img src="assets/images/img2.png" alt="Imagem de Perfil" height="50" width="50">
    </div>

    <img src="assets/images/img_fundo.png" alt="Imagem de fundo do login">

    <div class="msgbemvindo">
        <h1>Seja Bem-Vindo <br>
        Faça Login na sua conta!</h1>
    </div>

    <form method="get" action="dashboard.html">
        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>
        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required minlength="8">
        <div class="botoes">
            <a id="cadastro" href="cadastro.html">Cadastre-se</a>
            <input type="submit" id="login" value="login">
            <a id="sabermais" href="https://www.automateshow.com/blog/how-automation-is-impacting-the-automotive-industry-today" target="_blank">Saiba Mais ></a>
        </div>
    </form>

    <footer>
        <a href="https://pedrotech.com.br/pedrolandia/" target="_blank">Sobre</a>
    </footer>
    
</body>
</html>
