<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control - Esqueci minha senha</title>
</head>
<body>
    <header>
        <div id="logo">
            <img src="assets/images/img1.png" alt="Imagem da Logo" height="50" width="50">
        </div>
    </header>
    <h1>Digite sua nova senha</h1>
    <div id="perfil">
        <img src="assets/images/img2.png" alt="Imagem de Perfil" height="50" width="50">
    </div>
    <form class="form_redefinir_senha" method="get" action="index.html">
        <label for="redefinir_senha">Digite sua nova senha</label>
        <input type="password" name="redefinir_senha" id="redefinir_senha" required minlength="8">
        <label for="confirmar_nova_senha">Confirmar nova senha</label>
        <input type="password" name="confirmar_nova_senha" id="confirmar_nova_senha" required minlength="8">
        <div>
            <input type="submit" id="redefinir_senha" value="Redefinir senha">
        </div>
    </form>
    <footer>
        <a href="index.html">Voltar ao início</a>
        <p>&copy; 2026 Fregulia. Todos os direitos reservados</p>
    </footer>
</body>
</html>
