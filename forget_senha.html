<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control - Esqueceu a senha</title>
</head>
<body>
    <header>
        <div id="logo">
            <img src="assets/images/img1.png" alt="Imagem da Logo" height="50" width="50">
        </div>
    </header>
    <div id="perfil">
        <img src="assets/images/img2.png" alt="Imagem de Perfil" height="50" width="50">
    </div>
    <form method="get" action="index.html">
        <label for="email_recuperação">E-mail de Recuperação</label>
        <input type="email" name="email_recuperação" id="email_recuperação" placeholder="Digite seu e-mail de recuperação" required>
        <label for="código_recuperação">Digite o Código de Recuperação</label>
        <input type="" name="senha" id="senha" placeholder="Digite o código" required minlength="6">
        <div>
            <input type="submit" id="validar_código" value="Validar Código">
        </div>
    </form>
    <footer>
        <a href="index.html">Voltar ao início</a>
        <p>&copy; 2026 Fregulia. Todos os direitos reservados</p>
    </footer>
</body>
</html>
